name = "tarot-site"
compatibility_date = "2026-06-13"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"

# Cloudflare D1 Database binding for Cloudflare Pages / Workers
[[d1_databases]]
binding = "DB"
database_name = "astro-by-anisha-db"
database_id = "17ea3e17-019b-4742-a156-d3a39eddb0f2"

# Cloudflare R2 Bucket binding for media uploads
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "astro-by-anisha-uploads"
